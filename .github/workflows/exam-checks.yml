name: exam-checks
on:
  pull_request:
  push:
    branches: [integration/civil-exam-only]
jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/chatgpt-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/chatgpt-mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  legacy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
